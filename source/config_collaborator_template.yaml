mode: 'visual' # 'textual' or 'visual'
is_analysis: true
is_runtime_analysis: true
is_quiet: false

recording_filepath: data/REPLACE_WITH_RECORDING.raw
analysis_filepath: output/analysis.h5
save_bbox: output/detections.csv
tensorboard_log_file: output/tb_log.tfevents

simulate_real_time: true

height: 720
width: 1280

start_us: 0
end_us: 0

acc: 50000
fps: 20

temporal_stride: 1

k_min: 6
k_max: 6

alpha_of_burst_std: 0.9
alpha_interarrival_time: 0.001
alpha_interarrival_time_window_size: 8000
min_interarrival_time: 0.1
max_rate: 5000.0
T_min: 50

min_E_x_of_std: 3000
max_E_x_of_std: 100000

max_burst_std_per_cent: 100.0

polarity: 's' # 'n', 'p', 'b', or 's'

scale_down_factor: 1.0
rotation_angle: 0.0

compute_pitch_roll: false
pitch_roll_estimation_alpha: 0.0001
pitch_gt: 1.0
pitch_scaler: 1.0
